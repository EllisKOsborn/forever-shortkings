<!doctype html>
<!--
  Short Kings UI mockup (docs/DESIGN.md). NOT a game screenshot. Every screen is redrawn in HTML with the tokens from
  docs/design/tokens.json and the measurements in docs/DESIGN.md, so each
  rectangle maps to a WoW Texture/FontString/Frame. Item and class icons are
  placeholders; the glyph paths match docs/design/icons.js.
  Render: node docs/mockups/render.js <marcellus.woff2>
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Short Kings UI mockup</title>
<style>
/* Marcellus (OFL) stands in for the game font (Friz Quadrata); digits use a
   lining serif so numbers look like the game's. */
@font-face { font-family: "SKFriz"; src: url("marcellus.woff2");
  unicode-range: U+0020-002F, U+003A-00FF, U+2013-2026; }
@font-face { font-family: "SKFriz"; src: local("Bitstream Charter"), local("Charter"), local("Georgia"), local("DejaVu Serif"); unicode-range: U+0030-0039; }

/* Layout: 936x600 window = 64px rail + header band (64) + toolbar band (48)
   + content (24px side insets) + status line (28). Tokens mirror tokens.json. */
:root {
  --accent:#F27BC4; --onAccent:#1A0913; --sidebar:#140A11; --bg:#1C0E18; --panel:#24121F;
  --panelAlt:#2E1828; --sky:#4A1E3C; --text:#FBF2F7; --textDim:#D8C2CF; --textMuted:#AE93A3;
  --success:#6BD999; --warning:#FABF4D; --danger:#F57373; --brand:#D94FA0; --ember:#FF7A1A;
  --hair:rgba(255,255,255,.10); --hover:rgba(255,255,255,.06); --selected:rgba(255,255,255,.09);
  --pressed:rgba(255,255,255,.12);
  --hero:26px; --display:18px; --title:15px; --body:13px; --label:12px; --small:11px;
  color-scheme: dark;
}
* { box-sizing:border-box; }
body { margin:0; padding:40px; background:#0d0f12; color:var(--text);
  font-family:"SKFriz","Friz Quadrata TT",Georgia,serif; font-size:var(--body);
  text-shadow:1px -1px 0 rgba(0,0,0,.8); font-variant-numeric:tabular-nums lining-nums; }
.scene { position:relative; width:1016px; padding:40px; margin-bottom:40px;
  background:radial-gradient(ellipse at 30% 20%, #3b4a3a 0%, #22301f 45%, #141a12 100%); }
.cap { position:absolute; left:40px; top:10px; font:12px/16px system-ui,sans-serif; color:#cfd6c9; text-shadow:none; }

/* ---------- window shell ---------- */
.win { position:relative; width:936px; height:600px; background:var(--bg);
  outline:1px solid var(--hair); box-shadow:0 4px 24px 8px rgba(5,0,3,.6); overflow:hidden; }
.abs { position:absolute; }
.rail { position:absolute; left:0; top:0; width:64px; bottom:0; background:var(--sidebar);
  box-shadow:inset -1px 0 0 var(--hair); }
.emblem { position:absolute; left:14px; top:14px; width:36px; height:36px; }
.ri { position:absolute; left:4px; width:56px; height:56px; color:var(--textDim); text-align:center; }
.ri svg { position:absolute; left:18px; top:9px; width:20px; height:20px; }
.ri span { position:absolute; left:0; right:0; top:34px; font-size:var(--small); line-height:14px; }
.ri.on { background:var(--selected); color:var(--accent); }
.ri.on::before { content:""; position:absolute; left:-4px; top:0; bottom:0; width:2px; background:var(--accent); }
.ri.hov { background:var(--hover); color:var(--text); }
.ri.later { color:var(--textMuted); opacity:.55; outline:1px dashed var(--hair); outline-offset:-1px; }
.band { position:absolute; left:64px; right:0; top:0; height:64px;
  background:linear-gradient(to right, rgba(217,79,160,.22), rgba(217,79,160,0) 60%),
             linear-gradient(to bottom, var(--sky), var(--bg)); }
.band.full { left:0; }
.wordmark { position:absolute; left:24px; top:13px; font-size:var(--display); line-height:22px; color:var(--text); }
.tagline { position:absolute; left:25px; top:37px; font-size:var(--small); line-height:14px; color:var(--textDim); }
.fuse { position:absolute; left:0; bottom:0; width:46%; height:1px;
  background:linear-gradient(to right, rgba(255,122,26,.0), rgba(255,122,26,.75) 75%, rgba(250,191,77,1)); }
.spark { position:absolute; width:3px; height:3px; background:var(--warning);
  box-shadow:0 0 5px 2px rgba(255,122,26,.75); }
.close { position:absolute; right:12px; top:12px; width:24px; height:24px; color:var(--textDim); }
.close svg { position:absolute; left:6px; top:6px; width:12px; height:12px; }
.toolbar { position:absolute; left:64px; right:0; top:64px; height:48px; background:var(--panel);
  box-shadow:inset 0 -1px 0 var(--hair); }
.ptitle { position:absolute; left:24px; top:15px; font-size:var(--title); line-height:18px; }
.content { position:absolute; left:88px; right:24px; top:128px; bottom:44px; }
.statusline { position:absolute; left:64px; right:0; bottom:0; height:28px; background:var(--sidebar);
  box-shadow:inset 0 1px 0 var(--hair); font-size:var(--small); line-height:28px; color:var(--textDim); }
.statusline .l { position:absolute; left:24px; } .statusline .r { position:absolute; right:24px; }

/* shell B: top tabs */
.tabsB { position:absolute; left:0; right:0; top:64px; height:40px; background:var(--sidebar);
  box-shadow:inset 0 -1px 0 var(--hair); display:flex; padding-left:16px; }
.tabB { position:relative; padding:0 16px; line-height:40px; font-size:var(--body); color:var(--textDim); }
.tabB.on { color:var(--accent); background:var(--selected); }
.tabB.on::after { content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--accent); }

/* ---------- controls ---------- */
.btn { position:absolute; height:28px; min-width:72px; padding:0 16px; display:flex; align-items:center;
  justify-content:center; gap:6px; font-size:var(--label); color:var(--text); background:var(--panelAlt);
  box-shadow:inset 0 0 0 1px var(--hair); white-space:nowrap; }
.btn.static { position:relative; }
.btn.ghost { background:transparent; }
.btn.primary { background:var(--accent); color:var(--onAccent); box-shadow:none; text-shadow:none; }
.btn.hov { background-image:linear-gradient(var(--hover),var(--hover)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
.btn.primary.hov { background:#F591CF; }
.btn.dis { opacity:.5; }
.btn.focus { box-shadow:inset 0 0 0 1px rgba(242,123,196,.8); }
.btn.sm { height:22px; min-width:0; padding:0 10px; font-size:var(--small); }
.btn svg { width:13px; height:13px; }
.search { position:absolute; height:28px; background:var(--sidebar); box-shadow:inset 0 0 0 1px var(--hair);
  font-size:var(--label); line-height:28px; color:var(--textMuted); padding-left:30px; white-space:nowrap; overflow:hidden; }
.search.filled { color:var(--text); }
.search.focus { box-shadow:inset 0 0 0 1px rgba(242,123,196,.8); }
.search svg { position:absolute; left:9px; top:8px; width:12px; height:12px; color:var(--textMuted); }
.menu { position:absolute; height:28px; background:var(--panelAlt); box-shadow:inset 0 0 0 1px var(--hair);
  font-size:var(--label); line-height:28px; padding-left:12px; color:var(--text); white-space:nowrap; }
.menu svg { position:absolute; right:10px; top:10px; width:9px; height:9px; color:var(--textDim); }
.menu.hov { background-image:linear-gradient(var(--hover),var(--hover)); box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
.pop { position:absolute; width:176px; background:var(--panel); box-shadow:inset 0 0 0 1px var(--hair), 0 4px 16px rgba(0,0,0,.5);
  padding:4px 0; z-index:5; }
.pop div { position:relative; height:26px; line-height:26px; padding-left:28px; font-size:var(--label); color:var(--text); }
.pop .hl { background:var(--hover); }
.pop .on::before { content:""; position:absolute; left:12px; top:10px; width:6px; height:6px; background:var(--accent); }
.pop .sep { height:9px; } .pop .sep::after { content:""; position:absolute; left:8px; right:8px; top:4px; height:1px; background:var(--hair); }
.check { position:absolute; display:flex; align-items:center; gap:8px; font-size:var(--label); white-space:nowrap; }
.box { width:14px; height:14px; background:var(--sidebar); box-shadow:inset 0 0 0 1px rgba(255,255,255,.22); position:relative; flex:none; }
.box.on { box-shadow:inset 0 0 0 1px var(--accent); }
.box.on::after { content:""; position:absolute; inset:3px; background:var(--accent); }
.seg { position:absolute; display:flex; height:24px; box-shadow:inset 0 0 0 1px var(--hair); }
.seg div { position:relative; padding:0 12px; line-height:24px; font-size:var(--label); color:var(--textDim); }
.seg div + div { box-shadow:inset 1px 0 0 var(--hair); }
.seg .on { background:var(--selected); color:var(--text); }
.seg .on::after { content:""; position:absolute; left:0; right:0; bottom:0; height:2px; background:var(--accent); }
.chip { display:inline-block; height:18px; line-height:18px; padding:0 6px; font-size:var(--small); vertical-align:1px;
  box-shadow:inset 0 0 0 1px currentColor; }
.chip.w { color:var(--warning); } .chip.d { color:var(--danger); } .chip.m { color:var(--textMuted); } .chip.s { color:var(--success); }

/* ---------- lists ---------- */
.list { position:absolute; background:var(--panel); box-shadow:inset 0 0 0 1px var(--hair); overflow:hidden; }
.lh { position:absolute; left:1px; right:1px; top:1px; height:24px; display:flex; box-shadow:inset 0 -1px 0 var(--hair);
  font-size:var(--label); line-height:24px; color:var(--textDim); padding-left:8px; }
.lh .sorted { color:var(--text); }
.lrows { position:absolute; left:1px; right:9px; top:25px; }
.row { position:relative; height:22px; display:flex; padding-left:8px; line-height:22px; font-size:var(--body); }
.row:nth-child(even) { background:rgba(255,255,255,.02); }
.row.hov { background:var(--hover); }
.row.sel { background:var(--selected); }
.row.sel::before { content:""; position:absolute; left:0; top:0; bottom:0; width:2px; background:var(--accent); }
.lh > div, .row > div { flex:none; padding-right:8px; white-space:nowrap; overflow:hidden; }
.r { text-align:right; }
.sb { position:absolute; right:2px; top:28px; width:2px; height:60px; background:rgba(255,255,255,.28); }
.dim { color:var(--textDim); } .mut { color:var(--textMuted); } .ok { color:var(--success); }
.wa { color:var(--warning); } .da { color:var(--danger); } .ac { color:var(--accent); }

/* status shapes: never colour alone */
.st { display:inline-block; width:8px; height:8px; margin-right:6px; vertical-align:0; }
.st.addon { background:var(--success); }
.st.plain { box-shadow:inset 0 0 0 1.5px var(--warning); }
.st.off { height:2px; vertical-align:3px; background:var(--textMuted); }
.mk { display:inline-block; width:12px; height:12px; vertical-align:-1px; margin-right:4px; }

/* ---------- cards ---------- */
.card { position:absolute; width:264px; height:206px; background:var(--panelAlt); box-shadow:inset 0 0 0 1px var(--hair); }
.card .ct { position:absolute; left:16px; top:14px; font-size:var(--title); line-height:18px; }
.card .big { position:absolute; left:16px; top:40px; font-size:var(--hero); line-height:30px; }
.card .bigl { position:absolute; left:16px; top:72px; font-size:var(--small); line-height:14px; color:var(--textDim); }
.card .cb { position:absolute; left:16px; right:16px; top:94px; font-size:var(--label); line-height:20px; color:var(--textDim); }
.card .cb.top { top:42px; }
.card .cb b { font-weight:normal; color:var(--text); }
.card .btn { left:16px; bottom:16px; }
.kv { display:flex; justify-content:space-between; }

/* ---------- character ---------- */
.doll { position:absolute; left:0; top:64px; width:264px; height:364px; background:var(--panel); box-shadow:inset 0 0 0 1px var(--hair); }
.slot { position:absolute; width:36px; height:36px; background:var(--sidebar); }
.slot i { position:absolute; inset:1px; display:block; }
.slot b { position:absolute; left:0; right:0; bottom:1px; text-align:center; font:9px/9px system-ui,sans-serif; color:rgba(255,255,255,.8); text-shadow:0 0 2px #000; font-weight:normal; }
.slot .warn { position:absolute; right:-3px; top:-3px; width:12px; height:12px; background:var(--warning); }
.slot.hov { outline:1px solid var(--text); }
.sec { font-size:var(--label); line-height:16px; color:var(--textDim); margin:0 0 6px; }
.sec + .sec { margin-top:0; }
.col { position:absolute; top:64px; width:264px; font-size:var(--body); line-height:20px; }
.col h4 { margin:0 0 4px; font-weight:normal; font-size:var(--label); line-height:16px; color:var(--textDim);
  text-transform:uppercase; }
.col section { margin-bottom:16px; }

/* ---------- tooltips (the game's own GameTooltip frame) ---------- */
.tt { position:absolute; background:rgba(4,8,20,.92); border:1px solid #9aa4b8; border-radius:4px; padding:7px 10px;
  font-size:12px; line-height:17px; color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.6); white-space:nowrap; z-index:6; }
.tt .dl { display:flex; justify-content:space-between; gap:24px; }

/* ---------- empty state ---------- */
.empty { position:absolute; text-align:center; color:var(--textDim); font-size:var(--body); line-height:20px; }
.empty svg { width:32px; height:32px; color:var(--textMuted); display:block; margin:0 auto 12px; }
.empty .et { color:var(--text); font-size:var(--title); line-height:20px; margin-bottom:4px; }

/* ---------- sheets ---------- */
.sheet { position:relative; width:936px; background:var(--bg); outline:1px solid var(--hair); padding:24px; }
.sheet h3 { margin:0 0 12px; font-weight:normal; font-size:var(--label); letter-spacing:.06em; text-transform:uppercase; color:var(--textDim); }
.sheet .grp { position:relative; margin-bottom:24px; }
.swatches { display:grid; grid-template-columns:repeat(8, 1fr); gap:8px; }
.sw { height:64px; position:relative; box-shadow:inset 0 0 0 1px var(--hair); font-size:var(--small); }
.sw span { position:absolute; left:6px; bottom:5px; line-height:13px; }
.rowflex { display:flex; gap:12px; align-items:center; flex-wrap:wrap; position:relative; }
.typeline { display:flex; align-items:baseline; gap:16px; line-height:1.3; }
.typeline small { font-size:var(--small); color:var(--textMuted); width:110px; flex:none; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------------------------------------------------------------- helpers
const CLS = { WARRIOR:"#C69B6D", MAGE:"#3FC7EB", PRIEST:"#FFFFFF", ROGUE:"#FFF468", WARLOCK:"#8788EE",
  HUNTER:"#AAD372", DRUID:"#FF7C0A", PALADIN:"#F48CBA" };
const Q = { e:"#a335ee", r:"#0070dd", u:"#1eff00", c:"#ffffff" };

// Glyph family: 24-unit grid, 2-unit stroke, square caps, tinted at runtime.
const G = {
  overview:'<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',
  roster:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 5h2v2H4zM4 11h2v2H4zM4 17h2v2H4z"/>',
  character:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-1c0-3.3 3.6-6 8-6s8 2.7 8 6v1"/>',
  crafters:'<path d="M13 3l8 8-3 3-8-8z"/><path d="M11.5 9.5L3 18l3 3 8.5-8.5"/>',
  settings:'<path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 4v4M15 10v4M10 16v4"/>',
  raids:'<path d="M12 3l8 3v6c0 4.6-3.4 7.8-8 9-4.6-1.2-8-4.4-8-9V6z"/>',
  professions:'<path d="M9 3h6M10 3v6l-5.5 10.5c-.4.8.2 1.5 1 1.5h13c.8 0 1.4-.7 1-1.5L14 9V3"/><path d="M7 15h10"/>',
  close:'<path d="M3 3l18 18M21 3L3 21"/>',
  search:'<circle cx="10" cy="10" r="6.5"/><path d="M15 15l6 6"/>',
  chevron:'<path d="M4 8l8 8 8-8"/>',
  chevronLeft:'<path d="M16 4l-8 8 8 8"/>',
  copy:'<rect x="8" y="8" width="12" height="12"/><path d="M4 16V4h12"/>',
  inbox:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>',
  whisper:'<path d="M4 5h16v11H9l-5 4z"/>',
  refresh:'<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/>',
};
const ico = (k, w = 2.25) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${k === "close" ? 3 : w}" stroke-linecap="square">${G[k]}</svg>`;
// Ready-check style marks (the game's atlases UI-LFG-ReadyMark / DeclineMark / PendingMark).
const MK = {
  y:'<svg class="mk" viewBox="0 0 12 12"><circle cx="6" cy="6" r="6" fill="#2f9e3a"/><path d="M3 6.2l2 2 4-4.4" stroke="#fff" stroke-width="1.6" fill="none"/></svg>',
  n:'<svg class="mk" viewBox="0 0 12 12"><circle cx="6" cy="6" r="6" fill="#c0392b"/><path d="M3.8 3.8l4.4 4.4M8.2 3.8l-4.4 4.4" stroke="#fff" stroke-width="1.6"/></svg>',
  u:'<svg class="mk" viewBox="0 0 12 12"><circle cx="6" cy="6" r="6" fill="#d9a62e"/><text x="6" y="9.2" font-size="9" text-anchor="middle" fill="#3a2a00" font-family="Arial" font-weight="bold">?</text></svg>',
};
const st = (k) => `<span class="st ${k}"></span>`;
const ONLINE = { addon: st("addon") + "Online", alt: st("addon") + '<span class="dim">on alt</span>', plain: st("plain") + "Online" };
const online = (s) => ONLINE[s] || st("off") + `<span class="mut">${s}</span>`;
const cname = (n, c) => `<span style="color:${CLS[c]}">${n}</span>`;
const itemIcon = (a, b, size = 18) => `<span style="display:inline-block;width:${size}px;height:${size}px;vertical-align:-4px;margin-right:8px;background:radial-gradient(circle at 35% 30%, ${a}, ${b});box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)"></span>`;

// The dynamite emblem stand-in (the addon uses the game's INV_Misc_Bomb_04 icon).
const EMBLEM = `<svg class="emblem" viewBox="0 0 36 36"><rect width="36" height="36" fill="#2a1a14"/>
  <g transform="rotate(-30 18 21)"><rect x="12" y="12" width="12" height="20" fill="#b8325f"/><rect x="12" y="17" width="12" height="2" fill="#6b3e1e"/>
  <rect x="12" y="26" width="12" height="2" fill="#6b3e1e"/><path d="M18 12c0-4 3-4 2-7" stroke="#c9b28a" stroke-width="1.5" fill="none"/></g>
  <circle cx="13" cy="5" r="3.5" fill="#FABF4D" opacity=".9"/><rect width="36" height="36" fill="none" stroke="rgba(0,0,0,.7)"/></svg>`;

const RAIL = [["overview","Overview"],["roster","Roster"],["character","Character"],["crafters","Crafters"],["settings","Settings"]];
function rail(active, opts = {}) {
  let h = `<div class="rail">${EMBLEM}`;
  const items = opts.later ? RAIL.slice(0, 4).concat([["raids","Raids"],["professions","Professions"]], [RAIL[4]]) : RAIL;
  items.forEach(([k, label], i) => {
    const later = opts.later && (k === "raids" || k === "professions");
    const cls = k === active ? " on" : (k === opts.hover ? " hov" : "") + (later ? " later" : "");
    h += `<div class="ri${cls}" style="top:${76 + i * 60}px">${ico(k)}<span>${label === "Professions" ? "Profs" : label}</span></div>`;
  });
  return h + "</div>";
}
function band(full) {
  return `<div class="band${full ? " full" : ""}"><div class="wordmark">Short Kings</div><div class="tagline">Small in stature. Big in loot.</div>
    <div class="fuse"></div><span class="spark" style="left:calc(46% - 2px);top:62px"></span>
    <span class="spark" style="left:calc(46% + 5px);top:55px;width:2px;height:2px"></span>
    <span class="spark" style="left:calc(46% - 7px);top:52px;width:2px;height:2px;opacity:.7"></span>
    <div class="close">${ico("close")}</div></div>`;
}
function shell(o) {
  return `<div class="win">${rail(o.tab, o)}${band()}
    <div class="toolbar"><div class="ptitle">${o.title}</div>${o.toolbar || ""}</div>
    <div class="content">${o.content}</div>
    <div class="statusline"><span class="l">${o.status || ""}</span><span class="r">${st("addon")}Short Kings &nbsp;·&nbsp; sync on</span></div></div>`;
}
function list(o) {
  const head = o.cols.map((c, i) => `<div class="${c[2] || ""}${i === (o.sorted ?? 0) ? " sorted" : ""}" style="width:${c[1]}px">${c[0]}${i === (o.sorted ?? 0) ? " ▾" : ""}</div>`).join("");
  const rows = o.rows.map((cells, i) => `<div class="row${o.sel === i ? " sel" : ""}${o.hov === i ? " hov" : ""}"${o.rowStyle ? ` style="${o.rowStyle}"` : ""}>` +
    cells.map((c, j) => `<div class="${o.cols[j][2] || ""}" style="width:${o.cols[j][1]}px">${c}</div>`).join("") + "</div>").join("");
  return `<div class="list" style="${o.style}"><div class="lh">${head}</div><div class="lrows">${rows}</div>${o.scroll === false ? "" : '<div class="sb"></div>'}${o.extra || ""}</div>`;
}
const scene = (id, cap, inner) => `<div class="scene" id="${id}"><div class="cap">${cap}</div>${inner}</div>`;

// Toolbar control positions: content starts at x=24 inside the band; title then 24px gap.
const tb = (x, html) => html.replace(/^<div class="(\w+)/, `<div style="left:${x}px;top:10px" class="$1`);

// ---------------------------------------------------------------- data
const ROWS = [
