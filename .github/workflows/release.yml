name: Release

# Three ways in:
# 1. Automatic (v0.3.5): every push to main. If the top heading of
#    CHANGELOG.md is a dated version ("## v0.3.5 (7 Nov 2026)") with no GitHub
#    release yet, this tags that commit and starts this workflow again on the
#    tag (workflow_dispatch), which builds it. A heading that says "not
#    released" does nothing, and so does a version that's already released.
#    (Why the second run: the packager won't build a branch push whose commit
#    is tagged, and a tag pushed with GITHUB_TOKEN doesn't start workflows,
#    but a workflow_dispatch does.)
# 2. By hand: publishing a release on GitHub's website (or pushing a tag such
#    as v0.3.5).
# 3. Actions tab → Release → Run workflow, on a tag.
# Builds ShortRoyalty-<version>-forever.zip, attaches it to a GitHub Release
# with notes from CHANGELOG.md, and uploads to CurseForge (CF_API_KEY secret
# + "## X-Curse-Project-ID" in the TOC).
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to a commit, not a tag that could be moved:
# this job can publish releases, and its zip goes into everyone's game.
permissions:
  contents: write
  actions: write # to start the tag build from a push to main

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Building tag ${GITHUB_REF_NAME}"
            echo "release=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "release=no" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Not main and not a tag: nothing to do."; exit 0
          fi
          heading=$(grep -m1 '^## ' CHANGELOG.md || true)
          version=$(printf '%s\n' "$heading" | sed -nE 's/^## (v[0-9]+\.[0-9]+\.[0-9]+)( |$).*/\1/p')
          if [ -z "$version" ] || printf '%s' "$heading" | grep -qi 'not released'; then
            echo "Top of CHANGELOG.md is not a released version: $heading"; exit 0
          fi
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$version is already released; nothing to do."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # No release exists for this version, so (re)pointing its tag at this commit is safe.
          git tag -f -a "$version" -m "$version"
          git push -f origin "refs/tags/$version"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$version"
          echo "Tagged $version and started its build."
      - name: Install Subversion (needed to fetch LibDBIcon)
        if: steps.decide.outputs.release == 'yes'
        run: sudo apt-get update && sudo apt-get install -y subversion
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2
        if: steps.decide.outputs.release == 'yes'
