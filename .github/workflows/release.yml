name: Release

# Runs when a version tag such as v0.1.0 is pushed. Builds ShortKings-<version>.zip
# and attaches it to a GitHub Release. If the CF_API_KEY secret is set and the
# TOC has "## X-Curse-Project-ID", it also uploads to CurseForge.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Subversion (needed to fetch LibDBIcon)
        run: sudo apt-get update && sudo apt-get install -y subversion
      - uses: BigWigsMods/packager@v2
